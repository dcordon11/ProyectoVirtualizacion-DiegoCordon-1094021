  services:
    mongo:
      image: mongo:7
      container_name: backlog_mongo
      restart: always
      environment:
        MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
        MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      volumes:
        - mongo_data:/data/db
      networks:
        backlog_net:
          ipv4_address: 10.30.50.30

    backend:
      build: ./backend
      container_name: backlog_backend
      restart: always
      ports:
        - "5000:5000"
      environment:
        MONGO_USER: ${MONGO_INITDB_ROOT_USERNAME}
        MONGO_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
        MONGO_HOST: mongo
        MONGO_PORT: 27017
        MONGO_DATABASE: ${MONGO_DATABASE}
      depends_on:
        - mongo
      networks:
        backlog_net:
          ipv4_address: 10.30.50.20

    frontend:
      build: ./frontend
      container_name: backlog_frontend
      restart: always
      ports:
        - "5530:80"
      depends_on:
        - backend
      networks:
        backlog_net:
          ipv4_address: 10.30.50.10

  volumes:
    mongo_data:

  networks:
    backlog_net:
      driver: bridge
      ipam:
        config:
          - subnet: 10.30.50.0/24